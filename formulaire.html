<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>formulaire</title>
        <link rel="stylesheet" href="formulaire.css">
    </head>

    <body>


            <!--ici je crée un formulaire -->
        <form method="get" action="">

             <div id="nomPrenom">
                <!--je donne à mon input prenom un label qui s'appelle Prénom-->
                <label for="prenom">Prénom:</label>
                <input type="text" name="prenom">

                  <!--je donne à mon input nom un label qui s'appelle nom-->
                <label for="nom">Nom:</label>
                <input type="text" name="nom" id="nom">
             </div>  
            <br><br>
             <div id="dateVillage">
                <!--je donne à mon input dateDeNaissance un label qui s'appelle Date de naissance-->
                <label for="dateDeNaissance">Date de naissance:</label>
                <input type="date" name="dateDeNaissance" id="dateDeNaissance">
                <!--je donne à mon input village un label qui s'appelle Village-->
                <label for="village">Village:</label>
                <input type="text" name="village" id="village">
            </div>

            <br>
            <!--Ici je met deux bouton radio à cocher pour choisir le sexe-->
            
            <div id="genre">
                Sexe:
                <!--je donne à mon input sexe un label qui s'appelle Masculin-->
                <label for="sexe"> Masculin</label>
                <input type="radio" name="sexe" id="sexeMasculin">

                <!--je donne à mon input sexe un label quii s'appelle Féminin-->
                <label for="sexe">Féminin</label>
                <input type="radio" name="sexe" id="sexeFéminin">
            </div>

                <br>
            <!--je met 3 cases à cocher pour selectionner des disciplines -->
                <div id="Discipline">
                Discipline:
                <!--ici je donne à mon input Discipline un label qui s'appelle MATHS-->
                <label for="Discipline">MATHS</label>
                <input type="checkbox" name="Discipline" id="maths">
                
                <!--ici je donne à mon input Discipline un label qui s'appelle Histoire/Géographie-->
                <label for="Discipline">Histoire/Géographie</label>
                <input type="checkbox" name="Discipline" id="histoire">
                
                <!--ici je donne à mon input Discipline un label qui s'appelle EPS-->
                <label for="Discipline">EPS</label>
                <input type="checkbox" name="Discipline" id="eps">
                </div>
                <br>
                
                <div id="mail">
                <label for="mail"> Email:</label>
                <input type="email" name="mail" id="email">
                </div>

            <!--ici je rajoute un boutton envoyer dans mon formulaire-->
            <p id="envoyer">
                <input type="submit" value="Envoyer">
            </p>

        </form>

    </body>
</html>
