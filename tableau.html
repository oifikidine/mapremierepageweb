<!DOCTYPE html>
<html>

        <title>Tableau</title>
        <link rel="stylesheet" href="tableau.css">
    </head>
    <body>
        <!--Ici je crée un tableau-->

                <th>PRENOM</th>
                <th>DATE DE NAISSANCE</th>
                <th>VILLAGE</th>
            </tr>

</html>
